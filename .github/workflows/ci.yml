name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a green tick be obtained for a commit that never had one. Merges that
  # land as merge commits do trigger the push above, but a run can also be
  # cancelled by the concurrency group below, or skipped while the workflow file
  # itself is being changed — and then main sits untested with nothing to say so.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    # The same major version the app runs against elsewhere. A file-backed
    # SQLite stand-in would no longer be testing the same database: case
    # sensitivity, transactions and concurrency all differ.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gcoms_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # The app validates env at boot and refuses to start without these.
      # Test-only values; production secrets come from the deploy environment.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gcoms_ci
      # A separate database, not just a separate schema: the e2e specs refuse to
      # run against the one the app is using, which is what stops them
      # truncating a developer's data when run locally.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gcoms_ci_e2e
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - name: Create the e2e database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE gcoms_ci_e2e'
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Lint
        # A hard gate now. The backlog it used to allow through — 308 errors —
        # is cleared, and clearing it turned up a privilege escalation, four
        # unguarded routes and a dozen defects that no test could have caught,
        # because there was nothing typed for a test to disagree with.
        run: npx eslint "src/**/*.ts" --max-warnings 0
      - name: Typecheck
        # `npm run build` uses tsconfig.build.json, which excludes the specs.
        # This covers the whole project. It is a hard gate: ts-jest runs with
        # isolatedModules, so it transpiles without type-checking and a tree
        # that does not compile can still show 169 passing tests.
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npx jest --ci
      - name: End-to-end tests
        run: npx jest --ci --config ./test/jest-e2e.json
      - name: Smoke test the built server
        run: |
          node dist/main &
          for i in $(seq 1 30); do
            sleep 1
            curl -sf http://localhost:3001/health >/dev/null && break
          done
          curl -sf http://localhost:3001/health
          curl -sf http://localhost:3001/health/ready
          # An unauthenticated request to patient data must be refused.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/participants)
          test "$code" = "401" || { echo "expected 401 from /participants, got $code"; exit 1; }

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Lint
        # The web job had no lint step, so its 193 errors were not merely
        # tolerated — they were unmeasured. Warnings are allowed through: see
        # the note on set-state-in-effect in eslint.config.mjs.
        #
        # The count is pinned rather than uncapped. Every one of the 31 has been
        # read and explained; a 32nd has not, and without a ceiling nothing
        # distinguishes the two. Lower this when one is removed — it only ever
        # goes down.
        run: npx eslint src --max-warnings 31
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Assert the service worker was emitted
        # The app calls itself offline-first and queues patient registrations
        # against a dropped connection, all of which depends on a worker that
        # next-pwa only writes during a production build. It went missing in a
        # way nothing detected for as long as this file has existed: next-pwa's
        # `register: true` injects into a Pages Router `_app`, which this
        # application does not have, so the worker was built, shipped, and never
        # registered. It is registered explicitly now — this checks the other
        # half, that there is something there to register.
        run: |
          test -f public/sw.js || { echo "public/sw.js was not generated"; exit 1; }
          ls public/workbox-*.js >/dev/null 2>&1 || { echo "workbox runtime missing"; exit 1; }
      - name: Assert no demo credentials in the production bundle
        # Scoped to what is actually served. The previous version grepped all of
        # `.next`, which includes `.next/cache/webpack/*.pack` — webpack's build
        # cache, holding the original source of every module. So it asserted the
        # demo block was absent from the *source*, which it never is and never
        # will be; it is gated on NODE_ENV and dead-code eliminated instead. The
        # check could only ever have passed by deleting the feature.
        #
        # It failed on the runner and not locally for an unrelated reason worth
        # knowing: a developer shell whose `grep` skips binary files, or honours
        # .gitignore, silently searches none of `.next`.
        run: |
          shipped=".next/static .next/server public"
          fail=0

          # The heading is the demo block's unique marker: if the block survives
          # the production build, this string survives with it.
          if grep -rq "Select a Demo Account" $shipped; then
            echo "The demo shortcut block reached the production bundle:"
            grep -rl "Select a Demo Account" $shipped
            fail=1
          fi

          # And the addresses themselves, since a refactor could drop the heading
          # while keeping the buttons. One is allowed through: the login field's
          # `placeholder="e.g. executive@gcoms.org"`, which renders as visible
          # example text rather than as a way in.
          leaked=$(grep -rhoE "[a-z_]+@gcoms\.org" $shipped \
            | sort -u \
            | grep -vxE "executive@gcoms\.org" || true)
          if [ -n "$leaked" ]; then
            echo "Demo account addresses reached the production bundle:"
            echo "$leaked"
            fail=1
          fi

          exit $fail

  ui:
    name: UI verification (browser)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gcoms_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # A fresh database built from migrations, not a copy of anyone's — the
      # same path a deployment takes.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gcoms_ui
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      ALLOWED_ORIGINS: http://localhost:3000
      # The seed generates a random password unless told otherwise; the browser
      # run needs to know it in order to sign in.
      SEED_PASSWORD: ci-verification-password
      UI_PASSWORD: ci-verification-password
      NEXT_PUBLIC_API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install API dependencies
        working-directory: apps/api
        run: npm ci
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      # No Chrome on the runner, so Playwright's own build is used. The script
      # prefers a system Chrome when one exists and falls back to this.
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Prepare the database
        working-directory: apps/api
        run: |
          npx prisma generate
          npm run db:migrate
          npm run db:seed

      - name: Build both apps
        run: |
          cd apps/api && npm run build
          cd ../web && npm run build

      - name: Start the stack
        run: |
          # Subshells: a bare `cd` in the first line would make the second
          # relative to apps/api.
          (cd apps/api && node dist/main &)
          (cd apps/web && npx next start -p 3000 &)
          for i in $(seq 1 60); do
            sleep 2
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/health || true)
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then break; fi
          done
          test "$api" = "200" || { echo "API failed to start"; exit 1; }
          test "$web" = "200" || { echo "web failed to start"; exit 1; }

      # Fails the build on any uncaught exception or CSP violation. Other
      # console errors and blank pages are reported too, and visible in the log.
      - name: Verify every route and role in a browser
        working-directory: apps/web
        run: npm run verify:ui -- /tmp/gcoms-ui

      # Text that is present, correct and unreadable is the one failure the
      # sweep above cannot see: nothing throws, nothing is blank, and the
      # console stays quiet. This measures every element against its real
      # backdrop on every route in both themes, and fails on WCAG AA. It runs
      # after the sweep so a page that is merely broken is reported as broken
      # rather than as a contrast problem.
      - name: Verify text contrast in both themes
        working-directory: apps/web
        run: npm run verify:contrast

      # Uploaded even on failure — a screenshot is how you see what a broken
      # page actually looked like.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: /tmp/gcoms-ui
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: apps/api
          push: false
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          push: false
